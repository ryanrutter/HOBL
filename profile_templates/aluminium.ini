; This is a default parameters file for Aluminium (Android desktop) devices, such as Googlebooks.
; It shows the minimum parameters that need to be set.  See default.ini for a description of the format.
; Please copy it outside of the HOBL directory and name it something specific to the device it will be associated with,
; i.e. "googlebook1_profile.ini".  You should have a separate file for each DUT (Device Under Test).
; Set up the DUT first with setup_src\src_dut_aluminium\dut_setup_aluminium.ps1.  See docs\support\docs\HOBL_Setup.md.

[global]
; The directory to write results.  Typically, this should be changed for each study with a
; path that includes the name of the study.
result_dir=c:\hobl_results
; Name of Device Under Test.  Every DUT on the lab network needs to have a unique name.
dut_name=
; IP address of the Device Under Test, as reported by dut_setup_aluminium.ps1 or launch_agent.ps1.
dut_ip=
; Host IP used by web_replay. Set this to the Host's LAN address when running al_web.
web_replay_ip=
; Platform of Device Under Test.
platform=Aluminium
; Architecture of Device Under Test, valid values are: x64 or arm64.  [DUT_ARCHITECTURE] is not supported on Aluminium.
; dut_setup_aluminium.ps1 reports the architecture: x86_64 is x64, arm64-v8a is arm64.
dut_architecture=arm64
; Web browser to use.
browser=Chrome
; List any tools that should be run with each power scenario, in a space-separated list.  Available tools are in the "tools" directory.
tools=run_report
; List any tools that should be run with each prep scenario, in a space-separated list.
prep_tools=

; The following callbacks can be used to execute shell commands at specific events, to enable integration with
; external programs and equipment.  See default.ini for examples.
;
; callback_test_begin=
; callback_test_end=
; callback_data_ready=
; callback_test_fail=

; Specify a host shell command to run on the device charger
charge_on_call=

; Specify a host shell command to run off the device charger
charge_off_call=

; ---- Accounts and credentials ----
; Never commit a profile that contains these values. HOBL replaces account IDs, passwords, PINs, and access keys
; with ******** in its logs. Keep per-device profiles outside the repository and outside cloud-synced folders.
; Run "al_accounts_check" to see which keys are set; it reports only "set" or "missing".
; Microsoft account used for Microsoft 365 and OneDrive (the same keys as Windows).
msa_account=
dut_password=
; Google test account the Googlebook is signed in with (Windows has no equivalent).
google_account=
google_password=
; Android lock-screen PIN of the test user.
dut_pin=
; Wi-Fi network the DUT should join.
dut_wifi_name=
dut_wifi_password=

; Delay in seconds to wait before starting each scenario
pre_run_delay=0
; Delay in seconds to wait after each scenario completes
post_run_delay=0

[display]
; Specify the display brightness for HOBL compliant testing (150 nits).  Run
; setup_src\src_dut_aluminium\calibrate_brightness.ps1 with a luminance meter to find the value for this device,
; then set nits_map, for example "150nits:36%".
brightness=150nits
nits_map=

[netflix]
; Netflix Premium account for al_netflix playback.  Up to 4 DUTs can share one account.
netflix_username=
netflix_password=

[teams]
; Teams bots access key.  Contact HOBLsupport@microsoft.com to request one.
access_key=

[teams_install]
; Teams test account for al_teams_prep, in the Teams test organization, as on Windows.  Leave empty to use msa_account and dut_password.
teams_msa_account=
teams_msa_password=

[study_report]
template=docs\basic_study_report_template.xlsx

; Add any additional sections for tools or scenarios where you want to change the values from default.
